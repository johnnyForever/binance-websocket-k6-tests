name: PR or push to github - smoke test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: "bash"

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t k6-tests .

      - name: Create results directory
        run: mkdir -p results

      - name: Run k6 smoke tests
        run: |
          docker run --rm \
            -e ENV=production \
            -e PROFILE=smoke \
            -v $(pwd)/results:/tests/results \
            k6-tests \
            --out json=/tests/results/aggTrade.json dist/aggTradeTest.test.js
            
          docker run --rm \
            -e ENV=production \
            -e PROFILE=smoke \
            -v $(pwd)/results:/tests/results \
            k6-tests \
            --out json=/tests/results/restMarketSmoke.json dist/restMarketSmoke.test.js

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: results/
